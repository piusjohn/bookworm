<header class="flex justify-between items-center w-full px-container-padding h-16 bg-surface top-0 z-50">
<button aria-label="Menu" class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">menu_book</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-primary">BookWorm</h1>
<button aria-label="Search" class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">search</span>
</button>
</header>

<!-- Welcome Hero -->
<div class="text-center w-full max-w-md mx-auto space-y-8 flex flex-col items-center">
<!-- Logo Injection -->
<div class="w-32 h-32 md:w-40 md:h-40 rounded-xl overflow-hidden shadow-sm bg-surface-container flex items-center justify-center">
<img alt="BookWorm Logo" class="w-full h-full object-contain p-4 mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBla3dczAIA6AxltI0CzuFiDRX57cWtMyH_ZiBdWAAxVyItcn8dVN7qCRE-RbLAWSl70B0FUmZpcA_Eg58-XCXHW83zVDvnqOwzQ8sbe7QTVc3xah-ln3XsOLXGPnKCSizamppUZwkG2mvmQ3s4Z9YZoIhHab6mSSZ-SOPwyDN4fr3exHUHVwMWCplViW4Ify9NNGcrRANDnfGittwGNr0aLqf8ivsK6nzh8rdTwliTeS7WNgXvuJewqw"/>
</div>
<!-- Typography Hook -->
<div class="space-y-2">
<h2 class="font-display-lg text-display-lg text-primary tracking-tight">Your Digital Sanctuary.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Read better. Read more. A place for focused reading.</p>
</div>
<!-- Empty State Illustration Placeholder -->
<div class="w-64 h-64 mx-auto relative mt-8">

</div>

<button class="bg-primary text-on-primary rounded-full py-4 px-8 w-full max-w-xs font-title-md text-title-md shadow-md hover:shadow-lg hover:bg-on-primary-fixed-variant transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span>
                    Add PDF
                </button>
<p class="font-label-sm text-label-sm text-outline">Supports PDF, EPUB</p>
</div>
</div>

<span class="material-symbols-outlined filled">library_books</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Library</span>
</button>
<!-- Inactive Tab: Settings -->

<span class="material-symbols-outlined" style="font-size: 28px;">add</span>
