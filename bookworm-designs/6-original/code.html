<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .toolbar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toolbar-hidden-top {
            transform: translateY(-100%);
            opacity: 0;
        }
        .toolbar-hidden-bottom {
            transform: translateY(100%);
            opacity: 0;
        }
        /* PDF Page styles to simulate a document */
        .pdf-page {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            aspect-ratio: 1 / 1.414; /* A4 proportion roughly */
            background-color: #ffffff;
            margin: 0 auto;
            max-width: 100%;
        }
    </style>
<style>
    body {

<body class="h-full bg-surface-container-low text-on-surface overflow-hidden flex flex-col font-body-md select-none">
<!-- Top Toolbar (Auto-hiding) -->

</div>
<div class="flex items-center gap-2">

<!-- Thumb -->

</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const topToolbar = document.getElementById('top-toolbar');
            const bottomToolbar = document.getElementById('bottom-toolbar');
            const pdfContainer = document.getElementById('pdf-container');
            
            let isToolbarVisible = true;
            let lastScrollTop = 0;
            let scrollTimer = null;

            // Toggle toolbars on tap anywhere in the main container
            pdfContainer.addEventListener('click', (e) => {
                // Don't toggle if clicking near the bottom (slider area) to avoid conflict
                if (e.clientY > window.innerHeight - 100) return;

                isToolbarVisible = !isToolbarVisible;
                updateToolbarVisibility();
            });

            // Auto-hide on scroll
            pdfContainer.addEventListener('scroll', () => {
                let st = pdfContainer.scrollTop;
                
                if (st > lastScrollTop && st > 50) {
                    // Scrolling down
                    if (isToolbarVisible) {
                        isToolbarVisible = false;
                        updateToolbarVisibility();
                    }
                }
                lastScrollTop = st <= 0 ? 0 : st; // For Mobile or negative scrolling

                // Clear previous timeout and set a new one to show toolbars when scrolling stops
                if(scrollTimer !== null) {
                    clearTimeout(scrollTimer);
                }
                
                // Optional: Auto-show when scrolling stops for a while. 
                // Disabled here to keep focus mode until tapped again, 
                // which is more common in PDF readers.
                /*
                scrollTimer = setTimeout(function() {
                    if (!isToolbarVisible) {
                        isToolbarVisible = true;
                        updateToolbarVisibility();
                    }
                }, 1500);
                */
            }, false);

            function updateToolbarVisibility() {
                if (isToolbarVisible) {
                    topToolbar.classList.remove('toolbar-hidden-top');
                    bottomToolbar.classList.remove('toolbar-hidden-bottom');
                } else {
                    topToolbar.classList.add('toolbar-hidden-top');
                    bottomToolbar.classList.add('toolbar-hidden-bottom');
                }
            }
        });
    </script>
